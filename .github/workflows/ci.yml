name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  dotnet:
    name: .NET Build & Test
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: dotnet build
        run: dotnet build RiftAssetDumper.slnx --nologo

      - name: dotnet format (check)
        run: dotnet format RiftAssetDumper.slnx --verify-no-changes

      - name: dotnet test
        run: dotnet test RiftAssetDumper.slnx --nologo

  python:
    name: Python Lint & Test
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest jsonschema pefile ijson Pillow

      - name: Python syntax check
        run: python -c "import py_compile, glob; [py_compile.compile(f) for f in glob.glob('scripts/*.py')]"

      - name: ruff lint
        run: ruff check scripts/

      - name: mypy type check
        run: mypy scripts/ --no-error-summary

      - name: Python tests
        run: |
          $tests = Get-ChildItem scripts/test_*.py | Sort-Object Name
          foreach ($test in $tests) {
            Write-Host "==> $($test.FullName)"
            python $test.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Pytest regression suite
        run: python -m pytest tests/ -q

  lint-docs:
    name: Docs Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: |
            docs/**/*.md
            *.md
          config: .markdownlint.json

  pre-commit:
    name: Pre-commit Checks
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit ruff mypy pytest ijson jsonschema Pillow pefile

      - name: Run pre-commit
        env:
          SKIP: gitleaks
        run: pre-commit run --all-files

  orphan-guard:
    name: Orphan Guard Regression
    runs-on: windows-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run orphan-guard regression tests
        run: |
          python -m pytest tests/test_rift_workflow_orphan_guard.py tests/test_rift_workflow_orphan_guard_bypass.py tests/test_bulk_export_orphan_guard.py tests/test_rift_read_only_no_spawn.py -v --no-header

  final:
    name: Summary
    needs: [dotnet, python, lint-docs, orphan-guard, pre-commit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.dotnet.result }}" = "success" ] && [ "${{ needs.python.result }}" = "success" ] && [ "${{ needs.lint-docs.result }}" = "success" ] && [ "${{ needs.orphan-guard.result }}" = "success" ] && [ "${{ needs.pre-commit.result }}" = "success" ]; then
            echo "✅ All CI checks passed"
          else
            echo "❌ Some CI checks failed"
            echo "  dotnet: ${{ needs.dotnet.result }}"
            echo "  python: ${{ needs.python.result }}"
            echo "  lint-docs: ${{ needs.lint-docs.result }}"
            echo "  orphan-guard: ${{ needs.orphan-guard.result }}"
            echo "  pre-commit: ${{ needs.pre-commit.result }}"
            exit 1
          fi
