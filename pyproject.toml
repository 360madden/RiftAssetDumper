[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
target-version = "py314"
line-length = 120

# Match existing project conventions
extend-include = ["*.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = [
    "N802",  # function names starting with underscore are fine for PS→Py ports
    "N803",  # argument names with uppercase are fine for PS→Py ports
    "N806",  # variable names with uppercase are fine for PS→Py ports
]

[tool.mypy]
python_version = "3.14"
strict = true
exclude = [
    "scripts/Invoke-RiftAssetWorkflow.ps1",
    "scripts/Invoke-RiftWorkflow.ps1",
]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "scripts.*"
disallow_untyped_defs = false  # PS→Py ports use Any for flexibility
strict = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
