[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
target-version = "py314"
line-length = 120

# Match existing project conventions
extend-include = ["*.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",   # line length enforced by ruff format, not lint
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = [
    "N802",  # function names starting with underscore are fine for PS→Py ports
    "N803",  # argument names with uppercase are fine for PS→Py ports
    "N806",  # variable names with uppercase are fine for PS→Py ports
]

[tool.mypy]
python_version = "3.14"
exclude = [
    "scripts/Invoke-RiftAssetWorkflow.ps1",
    "scripts/Invoke-RiftWorkflow.ps1",
]
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "scripts.*"
disallow_untyped_defs = false  # PS→Py ports use Any for flexibility
disable_error_code = [
    "no-untyped-call",    # PS→Py port artifacts: typed contexts calling untyped helpers
    "call-overload",      # JSON-sourced objects passed to int() — pragmatic Any usage
    "no-redef",           # dotnet_args redefined per command block — intentional PS→Py pattern
    "type-arg",           # bare dict/list without type args — pragmatic Any usage
    "operator",           # str+int etc. — runtime-safe in practice
    "union-attr",         # None attribute access on Optional — guarded at runtime
    "var-annotated",      # missing variable annotations — pragmatic Any usage
    "list-item",          # list type mismatches — JSON-sourced objects
    "assignment",         # type incompatibilities — runtime-safe
    "no-any-return",      # returning Any from typed functions — pragmatic
    "return-value",       # return type mismatch — runtime-safe
    "type-var",           # type variable issues — pragmatic
    "dict-item",          # dict value type mismatch — JSON-sourced
    "arg-type",           # argument type mismatch — runtime-safe
    "misc",               # miscellaneous type issues
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "src.*"
strict = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
